<html>
    <head>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class="home-side">
                <h3 class="location">HOME</h3>
                <div class="score">
                    <h1 id="home-el" class="number">0</h1>
                </div>
                <div id="button-opt">
                    <button onclick="homeAddOne()" class="points">1+</button>
                    <button onclick="homeAddTwo()" class="points">2+</button>
                    <button onclick="homeAddThree()" class="points">3+</button>
                </div>
            </div>
            <button onclick="newGame()" id="new-game">New Game</button>
             <div class="home-side">
                <h3 class="location">AWAY</h3>
                <div class="score">
                    <h1 id="away-el" class="number">0</h1>
                </div>
                <div id="button-opt">
                    <button onclick="awayAddOne()" class="points">1+</button>
                    <button onclick="awayAddTwo()"class="points">2+</button>
                    <button onclick="awayAddThree()"class="points">3+</button>
                </div>
            </div>
                
            
        </div>
        <script src="index.js"></script>
    </body>
</html>
